name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  vulnerability-scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --include-git-root
        ./pom.xml

  publish:
    needs: vulnerability-scan
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      # The runner image now ships Maven 4, where
      # central-publishing-maven-plugin 0.11.0 fails to strip
      # maven-metadata-central-staging.xml from the staging tree. Central then
      # rejects the bundle with "has content that does NOT have a .pom file".
      # Pin the 3.9.x line until the plugin supports Maven 4.
      - name: Pin Maven 3.9.16
        run: |
          set -euo pipefail
          url=https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
          sha=831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6
          curl -fsSL "$url" -o /tmp/maven.tar.gz
          echo "$sha  /tmp/maven.tar.gz" | sha512sum -c -
          sudo tar -xzf /tmp/maven.tar.gz -C /opt
          echo "/opt/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
      - name: Show Maven version
        run: mvn -v
      - name: Resolve and validate release version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Set release version
        run: mvn -B -ntp versions:set -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false
      - name: Rebuild and rerun release gates
        run: |
          mvn -B -ntp spotless:check install
          mvn -B -ntp dependency:analyze-only -DfailOnWarning=true
          mvn -B -ntp -f examples/quickstart/pom.xml -Dsignwell.sdk.version="$RELEASE_VERSION" verify
          test -f "target/signwell-sdk-$RELEASE_VERSION.jar"
          test -f "target/signwell-sdk-$RELEASE_VERSION-sources.jar"
          test -f "target/signwell-sdk-$RELEASE_VERSION-javadoc.jar"
          test -f target/bom.json
          jar tf "target/signwell-sdk-$RELEASE_VERSION.jar" | grep -q 'com/signwell/sdk/SignWellClient.class'
          jar tf "target/signwell-sdk-$RELEASE_VERSION.jar" | grep -q 'META-INF/LICENSE'
          jar tf "target/signwell-sdk-$RELEASE_VERSION.jar" | grep -q 'META-INF/README.md'
          unzip -p "target/signwell-sdk-$RELEASE_VERSION.jar" META-INF/MANIFEST.MF | grep -q "Implementation-Version: $RELEASE_VERSION"
      - name: Publish signed artifacts to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B -ntp -Prelease deploy -DskipTests
      - name: Create checksums
        run: sha256sum target/signwell-sdk-*.jar target/signwell-sdk-*.jar.asc target/bom.json > target/checksums.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/signwell-sdk-*.jar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signwell-sdk-${{ env.RELEASE_VERSION }}
          path: |
            target/signwell-sdk-*.jar
            target/signwell-sdk-*.jar.asc
            target/bom.json
            target/checksums.sha256
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--generate-notes)
          if [[ "$RELEASE_VERSION" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" target/signwell-sdk-*.jar target/signwell-sdk-*.jar.asc target/bom.json target/checksums.sha256 "${args[@]}"
